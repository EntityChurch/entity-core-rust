[package]
name = "entity-signaling"
version = "0.9.0"
edition.workspace = true
description = "system/signaling — the connection node (rendezvous + reflector): the four verbs plus the wrapped entity surface"

[dependencies]
# The entity wrapper's dependencies. `core.rs` uses NONE of these — see its
# module doc: the verbs are specified without reference to the entity system,
# and that separation is what makes the second (unwrapped) front end additive.
entity-ecf.workspace = true
# Node-side diagnostics only (`handler.rs` offer/collect). The rendezvous key
# each verb touched is the one fact that distinguishes "the two peers disagree
# on a bucket" from "they agree and the bucket is empty" — and it is invisible
# from either peer, because each can only see its own half. `core.rs` stays
# dependency-free; this is the entity-wrapper front end's dep.
tracing.workspace = true
entity-entity.workspace = true
# The §2.2 derivation calls Hash::compute (unconditionally SHA-256) — the
# substrate content-hash primitive, pinned to the floor format. Client-side only.
entity-hash.workspace = true
entity-types.workspace = true
entity-capability.workspace = true
# §6.3 verification: Ed25519 verify + the canonical peer-id derivation. The
# derivation is deliberately the canonical one, NOT §6.3's spelled-out legacy
# byte string — see docs/SPEC-AMBIGUITIES.md.
entity-crypto.workspace = true
entity-handler.workspace = true
# Canonical {type, data, content_hash} entity codec for the opaque coordination
# blobs — data embedded raw, never decode+re-encoded (byte fidelity).
entity-wire.workspace = true
async-trait.workspace = true
ciborium.workspace = true
thiserror.workspace = true
# Node-internal dedup index for §1.1 pin 2 only; never on the wire.
sha2.workspace = true
# Exchange nonces (§3) only.
rand.workspace = true
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `SessionId::generate` (§6.5) and `Nonce::generate` (§3) call `OsRng`. On
# wasm32-unknown-unknown that resolves to `crypto.getRandomValues` ONLY with
# getrandom's `js` backend; without it there is no backend and the call fails.
# `entity-crypto` already declares this and feature unification would carry it
# here transitively — but a `[security — MUST]` on our own function should not
# rest on a sibling crate's target block, so it is stated locally too.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[project]
name   = "Entity Core Rust"
slug   = "entity-core-rust"
repo   = "entity-core-rust"
github = "https://github.com/EntityChurch/entity-core-rust"
intro  = """
Entity Core Rust is a reference implementation of the Entity Core Protocol
(v7.9) — one of three independent implementations alongside the Go (oracle) and
Python references. It is a standalone Cargo workspace: a strict crate DAG (ECF
encoding → hashing → entities → crypto/store/types → capability/wire/handler →
protocol/tree/peer) with the protocol extensions (inbox, revision, identity,
registry, relay, encryption, …) and language/runtime bindings (FFI, Godot, a
higher-level SDK, and a WASM worker stack) layered on top. It depends only on
the protocol spec for its contract; downstream, the browser and Godot apps depend
on this repo's crates (git-pinned to a release tag). This is a 0.8 research
preview — the protocol is not locked at 1.0 — but the core wire format,
capabilities, and tree semantics are interop-validated against the Go and Python
peers, not just self-tested.
"""

# ── What each directory IS ────────────────────────────────────────────────────
# Declared because the defaults cannot know our layout. Declaring nothing would
# leave the old defaults in force; each of these exists because a check would
# otherwise be wrong about this repo.

[[area]]
path      = "docs/status"
kind      = "status"      # dated snapshots — HANDOFF/CHECKPOINT/PLAN. Ages out.
publishes = false

[[area]]
path      = "docs/outbox"
kind      = "outbox"      # routing packets we SENT. Never published.
publishes = false

[[area]]
path      = "docs/archive/outbox"
kind      = "outbox"      # acknowledged packets. Never published.
publishes = false

# Closed working memory. Dated BY DESIGN and does not age out — a snapshot is
# immutable once written, and several are cited by SHA from packets in the outbox.
[[area]]
path      = "docs/archive/status"
kind      = "archive"
publishes = false

# Implementation-side proposals routed upstream. Internal: the normative text is
# arch's, and two documents with different statuses in front of one reader is the
# mistake this avoids.
[[area]]
path      = "docs/proposals"
kind      = "archive"
publishes = false

[[area]]
path      = "docs/agents/memory"
kind      = "memory"      # living, indexed; every file declared below.
publishes = true

# `docs/validation/reports/` is dated BY DESIGN and does not age out: each file is
# the record of one cross-impl measurement, cited by SHA from routing packets and
# from the charter. It is an archive, not a status queue.
[[area]]
path      = "docs/validation/reports"
kind      = "archive"
publishes = false

# The per-counterpart outbox watermarks (the routing standard's receiving half).
# Durable and edited in place, and they must NEVER publish — they name sibling
# repos, their tips, and what we have and have not read.
[[living]]
glob     = "docs/status/TRACKER-*.md"
internal = true

[[doc]]
path  = "README.md"
title = "Overview & build"
blurb = "What the repo is, the crate layout, and the make + podman build/test flow."
group = "Overview"

[[doc]]
path  = "docs/CLI.md"
title = "Command-line tools"
blurb = "The `entity` peer CLI (identity/peer subcommands) and the `make` build targets."
group = "Tools"

[[doc]]
path  = "docs/ARCHITECTURE.md"
title = "Architecture plan"
blurb = "The crate DAG, design decisions, and how the implementation maps to the spec."
group = "Architecture"

[[doc]]
path  = "docs/ARCHITECTURE-WASM-AND-TRANSPORT.md"
title = "Transport abstraction & WASM peer"
blurb = "The transport-agnostic networking model (TCP/WebSocket/HTTP) and the wasm32 peer."
group = "Architecture"

[[doc]]
path  = "docs/SPEC-AMBIGUITIES.md"
title = "Spec ambiguities log"
blurb = "The standing record of V7 spec ambiguities/gaps found while implementing, with the exact passage and the interim choice — the channel back to the architecture team."
group = "Spec findings"

[[doc]]
path  = "docs/SPEC-AMBIGUITIES-ROLE.md"
title = "Spec ambiguities — EXTENSION-ROLE"
blurb = "The ROLE-specific ambiguity log (resolved), retained for traceability of how the implementation choices were reconciled with the spec."
group = "Spec findings"

[[doc]]
path  = "docs/validation/CONFORMANCE-EXCLUSIONS.md"
title = "Declared conformance exclusions"
blurb = "Pinned vectors NOT exercised at the wire against this peer, how each is satisfied instead, and the mutation proving the substitute has teeth. A declared exclusion is not a pass and is counted in no gate number."
group = "Spec findings"

[[doc]]
path  = "docs/BACKLOG.md"
title = "Implementation backlog"
blurb = "Durable, spec-traced forward work for the Rust implementation (not a dated status snapshot)."
group = "Spec findings"

# ── Status ───────────────────────────────────────────────────────────────────
# The single rolling status log, and it stays declared. [ADR-0031] as first
# written banned `docs/status/` outright; it was corrected the same day — the
# dated snapshots (HANDOFF-*/CHECKPOINT-*/REVIEW-*) publish nothing, but the one
# rolling canonical STATUS.md does, because it is how a repo says out loud what
# it is working on.
#
# It moved from `docs/status/STATUS.md` to `docs/STATUS.md` so the two kinds
# separate by PATH rather than by remembering a filename: `docs/status/` is now
# uniformly dated snapshots, none of them declared. The old path is recorded in
# `.release-removals`.
[[doc]]
path  = "docs/STATUS.md"
title = "Status"
blurb = "Current project status — where the project is, recent work, backlog, and what's next."
group = "Overview"

# ── Project files ─────────────────────────────────────────────────────────────
# These were public at the last release but were never declared, and this manifest
# is a KEEP-LIST — so the next release would have DELETED all of them from the
# public repo. Declaring them is what keeps them. (Found by the arch-tools first
# full pass, 2026-08-22; the same omission was measured in every repo in the fleet.)

[[doc]]
path  = "CHANGELOG.md"
title = "Changelog"
blurb = "What changed in each release, newest first."
group = "Project"

[[doc]]
path  = "CONTRIBUTING.md"
title = "Contributing"
blurb = "How to propose a change, and the DCO sign-off the project requires."
group = "Project"

[[doc]]
path  = "CODE_OF_CONDUCT.md"
title = "Code of Conduct"
blurb = "What we expect of each other."
group = "Project"

[[doc]]
path  = "SECURITY.md"
title = "Security"
blurb = "How to report a vulnerability."
group = "Project"

# ── Agent + methodology overlay ───────────────────────────────────────────────
# Shared, byte-identical, injected fleet-wide (ADR-0010 / ADR-0028). METHODOLOGY.md
# is contributor-facing and publishes with the repo by ADR-0028; it is NEW to the
# public surface here, so the public-regress gate cannot vouch for it — a file that
# was never published cannot show up as a deletion. Declaring it is the only thing
# that ships it. The other three were already public and stay so.

[[doc]]
path  = "AGENTS.md"
title = "AGENTS.md"
blurb = "The durable agent context and operating agreement for this repo."
group = "Working here"

[[doc]]
path  = "AGENTS-STANDARD.md"
title = "Agent standard"
blurb = "The shared cross-repo standard every repo's AGENTS.md builds on."
group = "Working here"

[[doc]]
path  = "METHODOLOGY.md"
title = "Methodology"
blurb = "Disciplines, doctrines, the ratchet, and the promotion ladder (ADR-0028)."
group = "Working here"

[[doc]]
path  = "CLAUDE.md"
title = "CLAUDE.md"
blurb = "A one-line shim to AGENTS.md (ADR-0016)."
group = "Working here"

# ── Agent memory ──────────────────────────────────────────────────────────────
# Split out of AGENTS.md (217,374 bytes → ~17 KiB) on 2026-09-17. This is durable
# knowledge, not status: it publishes, because a newcomer hitting one of these
# symptoms is exactly who it was written for. The index and the files must agree
# in BOTH directions — a file here that INDEX.md does not list, or a link in
# INDEX.md with no file, is a blocking error at the cut.

[[doc]]
path  = "docs/agents/memory/INDEX.md"
title = "Agent memory — index"
blurb = "What this repo would otherwise rediscover the hard way, indexed by symptom. An entry that could become a check should become one, and is then deleted from here."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/BUILD-AND-RUST.md"
title = "Memory — build, feature gates, Rust idioms"
blurb = "Which make verb sees what; where the cfg matrix and the package set stop; two Rust shapes that are expensive to retrofit."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/CONCURRENCY-AND-STATE.md"
title = "Memory — concurrency, shared state, residue"
blurb = "Read-modify-write under a cascade, hot-path config caching, collectors for spec'd writes, and what a previous attempt leaves behind."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/AUTHORIZATION-AND-CAPABILITY.md"
title = "Memory — authorization and capabilities"
blurb = "Whose authority a check spends, which argument decides it, and what a relocated or newly-consuming check starts reading."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/PATHS-AND-VALIDATION.md"
title = "Memory — path helpers and boundary dispositions"
blurb = "One path rule implemented by two helpers, what a boundary may do with a malformed path, and what a consuming validator does to the fixtures."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/WIRE-AND-ENCODING.md"
title = "Memory — wire shapes, byte fidelity, error codes"
blurb = "What may appear on the wire and what a peer must preserve: byte fidelity, closed grammars, the (status, field, spelling) of an error code, and validators with no caller."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/TESTING-AND-EVIDENCE.md"
title = "Memory — tests, mutations, and evidence"
blurb = "The difference between a test that passes and a test that measures something: controls, mutations actually run, and the boundary a row crosses."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/CONFORMANCE-GATES.md"
title = "Memory — reading a cross-impl run"
blurb = "What a green category, a passing gate, a WARN, a SKIP and a FAIL detail line are each evidence of — and how a run says clean about a surface it never touched."
group = "Working here"

[[doc]]
path  = "docs/agents/memory/SPEC-RULINGS-AND-ROUTING.md"
title = "Memory — reading a ruling, a fold, a routed item"
blurb = "A routed pointer is where somebody looked; the spec says what binds. Deriving the boundary, recounting an enumeration against this tree, answering with a measurement."
group = "Working here"

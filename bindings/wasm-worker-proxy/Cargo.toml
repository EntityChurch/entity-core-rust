[package]
name = "entity-wasm-worker-proxy"
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Main-thread proxy for an entity-core peer hosted in a Web Worker. Mirrors the SDK L1 surface over postMessage; ships an in-process snapshot cache fed by subscription events. WASM-only."

[dependencies]
entity-wasm-worker-protocol = { path = "../wasm-worker-protocol", features = ["conversions"] }
# `signaling` is required for the §6.5 Direct-arm establisher: it gates
# `entity_peer::carrier::PeerCarrier` (and pulls `entity-signaling`). The worker
# arm reaches the same choreography from `wasm-worker-host`; this arm owns it
# in-crate (`main_thread_establish.rs`) because `WebRtcSession` is `pub(crate)`.
entity-peer = { path = "../../core/peer", default-features = false, features = ["signaling"] }
# The §6.5 negotiation choreography, native-tested in `extensions/signaling`.
# Reused verbatim by the Direct-arm establisher — `negotiate`, `WebRtcParty`,
# `WebRtcIo`, `pair_key`, `SessionId`, candidate types, `VerificationPolicy`.
entity-signaling = { workspace = true }
# `EntityUri::is_peer_id` — the same anti-mismatch guard the Worker arm keeps.
entity-entity = { workspace = true }
# The `LiveEstablish` / `WebRtcIo` traits are `async_trait`.
async-trait = { workspace = true }
# Monotonic clock for `WebRtcIo::now_ms`, never placed on the wire — same choice
# the Worker arm makes over `Date.now()`.
web-time = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
futures = "0.3"
ciborium.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "Worker",
    "WorkerOptions",
    "MessageEvent",
    "MessagePort",
    "MessageChannel",
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    # §6.5 WebRTC negotiation. Main-thread only — `RTCPeerConnection` is
    # `[Exposed=Window]` in the W3C IDL on every engine, which is why the
    # broker drives it on the worker's behalf rather than the worker owning it.
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
    # Read at failure time only. "the data channel closed before it opened" says
    # the channel died, not why — and `closed` vs `never opened` have different
    # causes. These two turn that into a verdict: ICE `failed` is a candidate
    # problem, ICE `connected` with a dead channel is DTLS/SCTP.
    "RtcIceConnectionState",
    "RtcPeerConnectionState",
    "Event",
] }

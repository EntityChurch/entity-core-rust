[package]
name = "entity-wasm-worker-proxy"
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Main-thread proxy for an entity-core peer hosted in a Web Worker. Mirrors the SDK L1 surface over postMessage; ships an in-process snapshot cache fed by subscription events. WASM-only."

[dependencies]
entity-wasm-worker-protocol = { path = "../wasm-worker-protocol", features = ["conversions"] }
entity-peer = { path = "../../core/peer", default-features = false }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
futures = "0.3"
ciborium.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
    "Worker",
    "WorkerOptions",
    "MessageEvent",
    "MessagePort",
    "MessageChannel",
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    # §6.5 WebRTC negotiation. Main-thread only — `RTCPeerConnection` is
    # `[Exposed=Window]` in the W3C IDL on every engine, which is why the
    # broker drives it on the worker's behalf rather than the worker owning it.
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
    # Read at failure time only. "the data channel closed before it opened" says
    # the channel died, not why — and `closed` vs `never opened` have different
    # causes. These two turn that into a verdict: ICE `failed` is a candidate
    # problem, ICE `connected` with a dead channel is DTLS/SCTP.
    "RtcIceConnectionState",
    "RtcPeerConnectionState",
    "Event",
] }

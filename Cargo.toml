[workspace]
resolver = "2"
members = [
    "core/ecf",
    "core/hash",
    "core/entity",
    "core/crypto",
    "core/store",
    "core/types",
    "core/capability",
    "core/wire",
    "core/handler",
    "core/protocol",
    "core/tree",
    "core/peer",
    "core/entity-core",
    "cmd/entity-peer",
    "cmd/wire-conformance",
    "extensions/inbox",
    "extensions/continuation",
    "extensions/subscription",
    "extensions/clock",
    "extensions/revision",
    "extensions/query",
    "extensions/history",
    "extensions/compute",
    "extensions/handler-ops",
    "extensions/capability",
    "extensions/identity",
    "extensions/attestation",
    "extensions/quorum",
    "extensions/role",
    "extensions/registry",
    "extensions/discovery",
    "extensions/relay",
    "extensions/route",
    "extensions/network",
    "extensions/durability",
    "extensions/encryption",
    "extensions/conformance",
    "extensions/type-system",
    "extensions/content",
    "extensions/storage-substitute-sources",
    "extensions/storage-substitute-http",
    "extensions/local-files",
    # The connection node + the §7 punch (EXTENSION-SIGNALING). Optional: no core
    # crate depends on it *by default*. `core/peer` gained an opt-in
    # `signaling` feature for the §10.3 punch policy (off in `default`), and the
    # node handler is still installed through the public `PeerBuilder::handler()`
    # seam.
    "extensions/signaling",
    "cmd/entity-signaling-node",
    # Rust's seat in the cross-impl signaling meet — same CLI/JSON/exit contract
    # as go's cmd/signaling-meet and py's signaling_meet.py.
    "cmd/signaling-meet",
    # Rust's seat in the cross-impl PUNCH (G2) — the §3.1 driver contract
    # agreed with Go: same flags, same JSON line, same exit rule.
    "cmd/signaling-punch",
    # Rust's seat in the §6.5 coordination crossing — the emit/verify contract
    # agreed with Go (their cmd/webrtc-vectors). Pure functions only: this
    # crosses the coordination half, never transport.
    "cmd/webrtc-vectors",
    "bindings/ffi",
    "bindings/sdk",
    "bindings/shell",
    # Intentionally NOT in default-members — the `make godot` lane (which
    # `make check` depends on) clippies and tests it. Reason is memory, and it
    # is measured, not assumed: `godot 0.4`'s `codegen-full` produces a single
    # rustc invocation that peaks at **4.44 GiB**, where EVERY OTHER crate in
    # this workspace put together peaks at 2.12 GiB (container cgroup
    # `memory.peak`, cold target dir, 4 CPUs, 2026-08-23). Folding it into the
    # default set would have forced `CAP_MEM` from 4g to 8g for every `make
    # test` on every machine so one finished binding could ride the same lane,
    # and it is not worth that — so `make godot` carries its own
    # `GODOT_CAP_MEM` ceiling instead. Cost of the lane: ~95 s and ~500 MiB of
    # artifacts on a cold build, for 21 godot tests — plus `entity-sdk`'s full
    # 259 (vs 216 in `make test`), because godot is the only crate that enables
    # the sdk's default-off `identity` / `role` / `quorum` / `attestation` /
    # `compute` features and the lane selects `-p entity-sdk` with it.
    "bindings/godot",
    # WASM-only proxy/host pair for browser-deployed peers. Each crate is
    # #![cfg(target_arch = "wasm32")] at root so native builds compile them
    # to an empty module. Intentionally NOT in default-members — the
    # `make wasm` lane cross-compiles them
    # (`cargo build --target wasm32-unknown-unknown -p ...`); a native build
    # would compile them to nothing and see no break in them.
    "bindings/wasm-worker-protocol",
    "bindings/wasm-worker-host",
    "bindings/wasm-worker-proxy",
    "bindings/wasm-worker-example",
]

# `cargo test` / `cargo clippy` / `cargo fmt` with no `-p` and no `--workspace`
# run THIS list, and those three are the whole gate (`make test` / `make lint`).
#
# **A member left out of this list carries a written reason naming the lane that
# covers it, or it belongs here.** There are exactly five exclusions and each
# states its reason + lane at its `members` entry above: the four
# `bindings/wasm-worker-*` crates (`make wasm`) and `bindings/godot`
# (`make godot`). Do NOT "fix" the wasm four by adding `--workspace` to
# `make test`: it would compile them natively to empty modules, which is
# coverage that looks like coverage and is not.
default-members = [
    "core/ecf",
    "core/hash",
    "core/entity",
    "core/crypto",
    "core/store",
    "core/types",
    "core/capability",
    "core/wire",
    "core/handler",
    "core/protocol",
    "core/tree",
    "core/peer",
    "core/entity-core",
    "cmd/entity-peer",
    "extensions/inbox",
    "extensions/continuation",
    "extensions/subscription",
    "extensions/clock",
    "extensions/revision",
    "extensions/query",
    "extensions/history",
    "extensions/compute",
    "extensions/handler-ops",
    "extensions/capability",
    "extensions/identity",
    "extensions/attestation",
    "extensions/quorum",
    "extensions/role",
    "extensions/registry",
    "extensions/discovery",
    "extensions/relay",
    "extensions/route",
    "extensions/network",
    "extensions/encryption",
    "extensions/conformance",
    "extensions/type-system",
    "extensions/content",
    "extensions/storage-substitute-sources",
    "extensions/storage-substitute-http",
    "extensions/local-files",
    # In default-members so CI compiles and tests the node — "optional" here
    # means *no core crate depends on it* (a peer never links it unless the
    # operator installs the handler), not "untested".
    "extensions/signaling",
    "cmd/entity-signaling-node",
    "cmd/signaling-meet",
    "cmd/signaling-punch",
    "cmd/webrtc-vectors",
    # ------------------------------------------------------------------------
    # Added 2026-08-23. These five were excluded with no stated reason and no
    # covering lane, so nothing ever built or ran them: this repo has no CI
    # workflows, and every `make` verb except `test`/`clippy`/`lint`/`fmt` names
    # its packages explicitly (`build` → `-p entity-cli`, `wasm` → `-p
    # entity-peer` + the worker crates, `features` → `-p entity-peer`). Excluded
    # from `default-members` therefore meant excluded from the gate, full stop.
    #
    # It cost us: `7c21d04` changed `make_execute_fn`'s signature and broke
    # `entity-sdk`'s compile outright, `90e60c0` repaired the call sites, and the
    # §5.2 D1 ceiling it introduced left
    # `follow_continuation_standing_leg_fires_cross_peer` RED on `dev` for five
    # days. Both commits reported "make test 115 suites green" and both were
    # telling the truth about the set they ran.
    #
    # 407 tests came in with them — sdk 216 · shell 163 · durability 18 ·
    # wire-conformance 10 — plus compile + clippy coverage for `bindings/ffi`,
    # which carries no tests but consumes the same core APIs and breaks the same
    # way. (`entity-sdk` has 259; the other 43 are gated behind `identity` /
    # `role` / `quorum` / `attestation` / `compute`, which are off by default and
    # which only `bindings/godot` turns on — so the `make godot` lane selects
    # `-p entity-sdk` alongside it and runs all 259 in one feature-unified
    # build.) Cold-build cost of the five, measured (container cgroup
    # `memory.peak`, fresh target dir, 4 CPUs): peak 2.12 → 2.37 GiB and 136 →
    # 161 s, so `CAP_MEM` stays at 4g and keeps its ~60% headroom.
    # `bindings/godot` was the sixth and is the one that did NOT come in — see
    # its `members` entry for the measurement and the lane that covers it.
    "cmd/wire-conformance",
    "extensions/durability",
    "bindings/ffi",
    "bindings/sdk",
    "bindings/shell",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/EntityChurch/entity-core-rust"

[workspace.dependencies]
# External
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
bs58 = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `Vec<u8>` fields that must encode as a CBOR bstr rather than an array of
# integers — the SDP payloads on the worker↔broker control plane, where the
# §6.5 invariant is about BYTES (see `ControlMessage`).
serde_bytes = "0.11"
# JSON is never a wire format here (the wire is CBOR, always). This is for the
# keystone-owned cross-peer *config* files — the §6.9a seed policy — whose
# canonical schema is JSON. Already in Cargo.lock transitively, so the direct
# edge adds no supply-chain surface.
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
directories = "5"
anyhow = "1"
web-time = "1.1"
unicode-normalization = "0.1"
# EXTENSION-ENCRYPTION v1.0 crypto stack (RustCrypto — pure Rust, WASM-clean).
# Scoped to extensions/encryption; intentionally NOT pulled into core/* so the
# core compile + WASM surface stays lean (judgment call: crypto primitives live
# in the extension, not core/crypto).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# curve25519-dalek provides the Ed25519→X25519 birational map (EdwardsPoint::
# to_montgomery) used by the §16 R6 key-separation check. Already in-tree as a
# transitive dep of both dalek crates; pinned here for the direct use-site.
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"

# Internal crates
entity-ecf = { path = "core/ecf" }
entity-hash = { path = "core/hash" }
entity-entity = { path = "core/entity" }
entity-crypto = { path = "core/crypto" }
entity-store = { path = "core/store" }
entity-types = { path = "core/types" }
entity-capability = { path = "core/capability" }
entity-wire = { path = "core/wire" }
entity-handler = { path = "core/handler" }
entity-protocol = { path = "core/protocol" }
entity-tree = { path = "core/tree" }
entity-peer = { path = "core/peer" }
entity-core = { path = "core/entity-core" }
entity-inbox = { path = "extensions/inbox" }
entity-continuation = { path = "extensions/continuation" }
entity-subscription = { path = "extensions/subscription" }
entity-clock = { path = "extensions/clock" }
entity-revision = { path = "extensions/revision" }
entity-query = { path = "extensions/query" }
entity-history = { path = "extensions/history" }
entity-compute = { path = "extensions/compute" }
entity-handler-ops = { path = "extensions/handler-ops" }
entity-capability-handler = { path = "extensions/capability" }
entity-identity = { path = "extensions/identity" }
entity-attestation = { path = "extensions/attestation" }
entity-quorum = { path = "extensions/quorum" }
entity-role = { path = "extensions/role" }
entity-registry = { path = "extensions/registry" }
entity-discovery = { path = "extensions/discovery" }
entity-relay = { path = "extensions/relay" }
entity-network = { path = "extensions/network" }
entity-route = { path = "extensions/route" }
entity-encryption = { path = "extensions/encryption" }
entity-durability = { path = "extensions/durability" }
entity-conformance = { path = "extensions/conformance" }
entity-type-system = { path = "extensions/type-system" }
entity-content = { path = "extensions/content" }
entity-storage-substitute-sources = { path = "extensions/storage-substitute-sources" }
entity-storage-substitute-http = { path = "extensions/storage-substitute-http" }
entity-local-files = { path = "extensions/local-files" }
entity-signaling = { path = "extensions/signaling" }
entity-sdk = { path = "bindings/sdk" }
entity-shell = { path = "bindings/shell" }
data-encoding = "2"

# Per-package optimization overrides for the dev profile.
#
# Crypto and CBOR libraries are heavily algorithmic and are pathologically
# slow when compiled at opt-level=0. They appear on every wire message
# (verify_request: 2× Ed25519 + multiple CBOR decodes per RPC), so debug
# builds without these overrides spend most of their time inside dalek's
# constant-time field arithmetic interpreting per-bit ladder steps as
# unoptimized stack frames. Build-time impact: small (these crates compile
# rarely). Runtime impact: ~100× faster verify_request in debug.
#
# Same code, just better-compiled — zero security impact.
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
# Ed448 (v7.67 Phase 2) is the same story as Ed25519, worse — its field/scalar
# arithmetic runs through the RustCrypto generic stack (ed448-goldilocks → ed448
# → elliptic-curve → crypto-bigint / fiat-crypto) plus SHAKE256, and verify is
# intrinsically ~10–15× heavier than Ed25519. Without these overrides a single
# Ed448 verify_request at opt-level=0 is slow enough that a request-heavy
# responder test (~650 EXECUTEs) blows past the cross-impl validator's per-test
# timeout — surfaced as a 2m18s rs-48 run that cascaded into 269
# spurious FAILs. Overrides apply per-package (not transitively), so optimize
# every heavy crate on the Ed448 path, not just the top-level signing crate.
[profile.dev.package.ed448-goldilocks]
opt-level = 3
[profile.dev.package.ed448]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.fiat-crypto]
opt-level = 3
[profile.dev.package.shake]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.ciborium]
opt-level = 3
[profile.dev.package.ciborium-io]
opt-level = 3
[profile.dev.package.ciborium-ll]
opt-level = 3
